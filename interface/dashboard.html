<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1225">
<title>PreceptorOS</title>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icono-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icono-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="/assets/icono-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/dashboard.css">
<link rel="stylesheet" href="/compass.css?v=39">
</head>
<body>

<div class="telon" id="telon" aria-hidden="true">
  <div class="telon-busto"></div>
  <img src="/assets/titulo-preceptoros.png" alt="PreceptorOS">
</div>

<div class="retrato">
  <div class="busto" id="busto" role="img"
       aria-label="Busto de mármol con un ojo encendido"></div>
  <h1 class="marca"><img src="/assets/titulo-preceptoros.png" alt="PreceptorOS"></h1>
  <div class="mando">
  <button class="hablar" id="hablar" type="button">
    <svg id="icono-hablar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <rect x="9" y="2" width="6" height="11" rx="3"></rect>
      <path d="M 5 11 a7 7 0 0 0 14 0"></path>
      <line x1="12" y1="18" x2="12" y2="22"></line>
    </svg>
    <span class="rotulo-boton" id="rotulo-hablar">Hablar</span>
  </button>
    <p class="pulso" id="pulso" aria-live="polite">…</p>
  </div>
</div>

<p class="fusion" id="fusion" hidden>
  <span id="fusion-texto"></span><span class="puntos" id="puntos"></span>
</p>

<main class="dice" id="dice" aria-live="polite"></main>

<div class="hablar-zona">
  <form class="escribir" id="escribir">
    <label class="sr" for="dicho" data-rotulo="o_escribelo">O escríbelo</label>
    <input id="dicho" type="text" placeholder="…o escríbelo aquí" autocomplete="off">
    <button type="submit" id="mandar" aria-label="Dilo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M 4 4 L 20 12 L 4 20 l 3 -8 Z"></path>
        <path d="M 7 12 h13"></path>
      </svg>
    </button>
  </form>
</div>

<nav class="barra-iconos" aria-label="Paneles">
  <button type="button" data-cajon="memoria" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M 4 5 a2 2 0 0 1 2 -2 h12 v18 H 6 a2 2 0 0 1 -2 -2 Z"></path>
      <path d="M 8 3 v18"></path><path d="M 12 8 h4"></path><path d="M 12 12 h4"></path>
    </svg><i aria-hidden="true"></i><span data-rotulo="memoria">Memoria</span>
  </button>
  <button type="button" data-cajon="frontera" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M 12 3 l 8 3 v5 c 0 5 -3.4 8.2 -8 10 c -4.6 -1.8 -8 -5 -8 -10 V 6 Z"></path>
      <path d="M 9 12 l 2 2 l 4 -4"></path>
    </svg><i aria-hidden="true"></i><span data-rotulo="frontera">Frontera</span>
  </button>
  <button type="button" data-cajon="camino" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M 4 21 h5 v-4 h5 v-4 h5 v-4 h1"></path>
      <path d="M 4 21 v-3"></path><path d="M 20 4 v2"></path>
    </svg><i aria-hidden="true"></i><span data-rotulo="camino">Camino</span>
  </button>
  <button type="button" data-cajon="medicion" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M 3 20 h18"></path><path d="M 6 20 v-6"></path>
      <path d="M 11 20 v-11"></path><path d="M 16 20 v-8"></path>
      <path d="M 21 20 v-14"></path>
    </svg><i aria-hidden="true"></i><span data-rotulo="medicion">Medición</span>
  </button>
  <button type="button" data-cajon="perfil" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M 4 21 c 0 -4.4 3.6 -7 8 -7 s 8 2.6 8 7"></path>
    </svg><i aria-hidden="true"></i><span data-rotulo="perfil">Perfil</span>
  </button>
  <button type="button" data-cajon="proyectos" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="7" width="18" height="13" rx="2"></rect>
      <path d="M 9 7 V 5 a2 2 0 0 1 2 -2 h2 a2 2 0 0 1 2 2 v2"></path>
      <path d="M 3 12 h18"></path>
    </svg><i aria-hidden="true"></i><span data-rotulo="proyectos">Proyectos</span>
  </button>
</nav>

<div class="velo" id="velo"></div>

<section class="cajon" id="cajon-memoria" aria-label="Memoria" hidden>
  <div class="asa"></div>
  <button class="volver" type="button" data-volver>← Volver</button>
  <h2><span data-rotulo="tu_memoria">Tu memoria</span></h2>
  <div class="dato"><span data-rotulo="m_guardados">Recuerdos guardados</span><b id="m-turnos">—</b></div>
  <div class="dato"><span data-rotulo="m_consentidos">Consentidos para aprender</span><b id="m-consent">—</b></div>
  <div class="dato"><span data-rotulo="m_corregidos">Corregidos por ti</span><b id="m-corr">—</b></div>
  <p class="nota" id="nota-memoria"></p>
</section>

<section class="cajon" id="cajon-medicion" aria-label="Medición" hidden>
  <h2 data-rotulo="medicion">Medición</h2>
  <p class="nota" data-rotulo="med_intro">Once campos. Lo que no se puede medir
    sale declarado, nunca en cero.</p>
  <div id="med-modelo" class="dato"></div>
  <div id="med-tabla"></div>
  <p class="nota" id="med-norma"></p>

  <!-- El selector de cerebro vive aquí y no en un cajón propio: elegir modelo
       y mirar los tokens por segundo es el mismo gesto. Separarlos obligaría a
       cambiar de pantalla entre la decisión y su medida, que es justo donde se
       pierde la costumbre de medir. -->
  <h3 class="sub-h" id="cer-titulo"></h3>
  <p class="nota" id="cer-uso"></p>
  <div id="cer-opciones"></div>
  <p class="nota" id="cer-dicho" hidden aria-live="polite"></p>
</section>

<section class="cajon" id="cajon-frontera" aria-label="Frontera" hidden>
  <div class="asa"></div>
  <button class="volver" type="button" data-volver>← Volver</button>
  <h2>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M 12 3 l 8 3 v5 c 0 5 -3.4 8.2 -8 10 c -4.6 -1.8 -8 -5 -8 -10 V 6 Z"></path>
      <path d="M 9 12 l 2 2 l 4 -4"></path>
    </svg>
    <span data-rotulo="la_frontera">La frontera</span>
  </h2>
  <div class="escudo-caja">
    <p id="frontera-que"></p>
    <p id="frontera-como"></p>
  </div>
  <a class="enlace" href="/app.html" data-rotulo="abrir_panel">Abrir el panel completo →</a>
</section>

<section class="cajon" id="cajon-camino" aria-label="El Camino" hidden>
  <div class="asa"></div>
  <button class="volver" type="button" data-volver>← Volver</button>
  <h2><span data-rotulo="la_frontera">El Camino</span></h2>
  <p class="nota" id="camino-intro"></p>

  <!-- La brujula, en la puerta de entrada y no en una cara aparte: es donde
       alguien mira cuando se pregunta por donde va. -->
  <div id="compass-container">
    <div id="compass-svg-hueco"></div>
    <p id="compass-rango"></p>
      <p id="compass-aviso" role="status" aria-live="polite"></p>
    <div id="compass-controles">
      <button type="button" id="compass-modo-camino" aria-pressed="true">The Path</button>
      <button type="button" id="compass-modo-detalle" aria-pressed="false">Detail</button>
    </div>
  </div>

  <ul class="camino" id="camino"></ul>
</section>

<section class="cajon" id="cajon-perfil" aria-label="Perfil" hidden>
  <div class="asa"></div>
  <button class="volver" type="button" data-volver>← Volver</button>
  <h2><span data-rotulo="el_camino">Perfil</span></h2>

  <label class="campo"><span id="et-nombre"></span>
    <input id="p-nombre" type="text" autocomplete="off"></label>
  <label class="campo"><span id="et-intereses"></span>
    <input id="p-intereses" type="text" autocomplete="off"></label>
  <label class="campo"><span id="et-idioma"></span>
    <select id="p-idioma">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select></label>

  <label class="campo"><span id="et-instrucciones"></span>
    <textarea id="p-instrucciones"></textarea></label>
  <p class="nota" id="nota-instrucciones"></p>

  <button class="guardar" type="button" id="p-guardar"></button>
  <p class="dicho-guardado" id="p-dicho" hidden></p>

  <div class="dato"><span id="et-cerebro"></span><b id="a-motor">—</b></div>
  <div class="dato"><span id="et-modelo"></span><b id="a-modelo">—</b></div>
  <p class="nota" id="a-ruta"></p>
  <div class="dato"><span id="et-cuaderno"></span><b id="a-captura">—</b></div>
  <p class="nota" id="a-nota"></p>
</section>

<section class="cajon" id="cajon-proyectos" aria-label="Proyectos" hidden>
  <div class="asa"></div>
  <button class="volver" type="button" data-volver>← Volver</button>
  <h2><span data-rotulo="perfil">Proyectos</span></h2>
  <p class="nota" id="proy-intro"></p>
  <label class="campo"><span id="et-titulo"></span>
    <input id="pr-titulo" type="text" autocomplete="off"></label>
  <label class="campo"><span id="et-ruta"></span>
    <input id="pr-ruta" type="text" autocomplete="off"></label>
  <button class="guardar" type="button" id="pr-anadir"></button>
  <ul class="lista-proyectos" id="lista-proyectos"></ul>
</section>

<script src="/dashboard.js"></script>
<script src="/compass.js?v=39"></script>
</body>
</html>
